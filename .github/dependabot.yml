version: 2
updates:
  - package-ecosystem: npm # pnpm-lock.yaml is supported by the npm ecosystem
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # types follow the Node major we run (22 LTS, see .nvmrc and the Dockerfile)
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # stay on the Node LTS line; digest and minor/patch updates still arrive
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
