services:
  rockola:
    build: .
    image: rockola:latest
    container_name: rockola
    env_file: .env
    restart: unless-stopped
    volumes:
      - rockola-data:/app/data
    # The bot needs no Linux capabilities and never escalates (runs as the "node" user).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  rockola-data:
